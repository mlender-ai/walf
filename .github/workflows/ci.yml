name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 서버 테스트 · BADBLOOD E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run e2e

  app:
    name: 앱 타입 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # react-dom 피어 버전 충돌(Expo SDK 58 템플릿) 때문에 legacy-peer-deps 로 설치한다
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
